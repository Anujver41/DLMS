<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${book.id == null ? 'Add New Book' : 'Edit Book'})}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 p-md-5 shadow-sm border-0 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h3 class="fw-bold text-dark mb-1" th:text="${book.id == null ? 'Add New Book' : 'Edit Book Record'}">Book Form</h3>
                            <p class="text-muted small mb-0">Fill in the book details to update the library catalog</p>
                        </div>
                        <a th:href="@{/admin/books}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to List
                        </a>
                    </div>

                    <form th:action="${book.id == null ? '/admin/books/new' : '/admin/books/edit/' + book.id}"
                          th:object="${book}" method="post">
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="title" class="form-label fw-semibold small">Book Title</label>
                                <input type="text" id="title" th:field="*{title}" class="form-control"
                                       placeholder="e.g. Clean Code" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="author" class="form-label fw-semibold small">Author(s)</label>
                                <input type="text" id="author" th:field="*{author}" class="form-control"
                                       placeholder="e.g. Robert C. Martin" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="isbn" class="form-label fw-semibold small">ISBN Identifier</label>
                                <input type="text" id="isbn" th:field="*{isbn}" class="form-control"
                                       placeholder="e.g. 978-0132350884" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold small">Category</label>
                                <select id="category" th:field="*{category.id}" class="form-select" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"
                                            th:selected="${book.category != null && book.category.id == cat.id}">Category</option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="totalQuantity" class="form-label fw-semibold small">Total Copies</label>
                                <input type="number" id="totalQuantity" th:field="*{totalQuantity}" class="form-control" min="1" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('totalQuantity')}" th:errors="*{totalQuantity}"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="rackNumber" class="form-label fw-semibold small">Rack Location</label>
                                <input type="text" id="rackNumber" th:field="*{rackNumber}" class="form-control"
                                       placeholder="e.g. RACK-A1">
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold small">Book Description / Summary</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                          placeholder="Enter brief description of book contents..."></textarea>
                            </div>

                            <div class="col-12 mt-4 text-end">
                                <a th:href="@{/admin/books}" class="btn btn-light me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:text="${book.id == null ? 'Save Book' : 'Update Record'}">Save</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Member Directory')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="bi bi-people-fill text-primary me-2"></i> Registered Member Accounts
                </h3>
                <p class="text-muted small mb-0">Manage library readers, access permissions, and account statuses</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
        </div>

        <div class="card p-4 shadow-sm border-0 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Member Name</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-end">Account Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member : ${members}">
                            <td class="text-muted small" th:text="${member.id}">1</td>
                            <td>
                                <strong class="text-dark" th:text="${member.fullName}">Full Name</strong>
                            </td>
                            <td>
                                <span class="text-muted" th:text="${member.email}">email@example.com</span>
                            </td>
                            <td class="small text-muted" th:text="${member.phone != null ? member.phone : '-'}">+91-0000000000</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${member.role}">ROLE_USER</span>
                            </td>
                            <td>
                                <span th:if="${member.active}" class="badge bg-success bg-opacity-10 text-success">Active</span>
                                <span th:unless="${member.active}" class="badge bg-danger bg-opacity-10 text-danger">Suspended</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{'/admin/members/toggle/' + ${member.id}}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${member.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                            th:text="${member.active} ? 'Suspend Account' : 'Activate Account'">
                                        Toggle
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

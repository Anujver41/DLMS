<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Books')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="bi bi-book text-primary me-2"></i> Book Repository Management
                </h3>
                <p class="text-muted small mb-0">Manage catalog records, inventory counts, and shelf locations</p>
            </div>
            <a th:href="@{/admin/books/new}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add New Book
            </a>
        </div>

        <div class="card p-4 shadow-sm border-0 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title & Author</th>
                            <th>Category</th>
                            <th>ISBN</th>
                            <th>Stock (Available/Total)</th>
                            <th>Rack</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td class="text-muted small" th:text="${book.id}">1</td>
                            <td>
                                <strong class="text-dark" th:text="${book.title}">Title</strong>
                                <div class="small text-muted">By <span th:text="${book.author}">Author</span></div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${book.category.name}">Category</span>
                            </td>
                            <td>
                                <code th:text="${book.isbn}">978-0000000000</code>
                            </td>
                            <td>
                                <span th:if="${book.availableQuantity > 0}" class="badge badge-in-stock px-2 py-1">
                                    <span th:text="${book.availableQuantity}">5</span> / <span th:text="${book.totalQuantity}">5</span>
                                </span>
                                <span th:if="${book.availableQuantity == 0}" class="badge badge-out-of-stock px-2 py-1">
                                    0 / <span th:text="${book.totalQuantity}">5</span> (Out of Stock)
                                </span>
                            </td>
                            <td class="small text-muted" th:text="${book.rackNumber != null ? book.rackNumber : '-'}">RACK-01</td>
                            <td class="text-end">
                                <a th:href="@{'/admin/books/edit/' + ${book.id}}" class="btn btn-outline-primary btn-sm me-1" title="Edit Book">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{'/admin/books/delete/' + ${book.id}}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this book record? This cannot be undone.');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete Book">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

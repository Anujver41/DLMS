<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Account')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 p-md-5 shadow-sm border-0 rounded-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus text-warning display-4 mb-2 d-inline-block"></i>
                        <h3 class="fw-bold text-dark">Join DLMS Library</h3>
                        <p class="text-muted small">Create a free student or reader account</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   placeholder="e.g. John Doe" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="john.doe@example.com" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                   placeholder="+91-9876543210">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Password (Min 6 characters)</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   placeholder="••••••••" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            <i class="bi bi-check-lg me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">Already registered? </span>
                        <a th:href="@{/login}" class="small fw-semibold text-primary text-decoration-none">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Error')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="main-content d-flex align-items-center py-5">
    <div class="container text-center py-5">
        <i class="bi bi-exclamation-triangle-fill display-1 text-warning mb-3 d-inline-block"></i>
        <h1 class="display-5 fw-bold text-dark" th:text="${errorTitle != null ? errorTitle : '500 - Server Error'}">500 - Server Error</h1>
        <p class="lead text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The server encountered an unexpected error.'}">Error detail</p>
        <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold">
            <i class="bi bi-house me-1"></i> Return to Homepage
        </a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
